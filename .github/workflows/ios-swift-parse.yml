name: Swift source syntax check

on:
  push:
    branches:
      - feature/ios-native-swiftui
    paths:
      - "ios/PineappleNote/**/*.swift"
      - ".github/workflows/ios-swift-parse.yml"
  pull_request:
    paths:
      - "ios/PineappleNote/**/*.swift"
      - ".github/workflows/ios-swift-parse.yml"

jobs:
  parse:
    name: Parse Swift sources
    runs-on: ubuntu-latest
    container: swift:6.2.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Parse each Swift source file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' source; do
            echo "Parsing $source"
            swiftc -frontend -parse "$source"
            count=$((count + 1))
          done < <(find ios/PineappleNote/Sources -type f -name '*.swift' -print0)
          test "$count" -gt 0
          echo "Parsed $count Swift source files."
